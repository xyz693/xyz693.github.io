const projects = atlasCatalog.map(body => ({ ...body }));

function visit(body) {
  if (ordered.includes(body)) return;

  visiting.add(body);
  if (body.parent) visit(byId.get(body.parent));
  ordered.push(body);
  visiting.delete(body);
}
projects.forEach(visit);
function inView(body) {
  if (!selected) return !body.parent;
  return body === selected || body.parent === selected.id || body.id === selected.parent;

const $=id=>document.getElementById(id), reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;let paused=reduced,selected=null,lastFocus=null;

function showDirectory(focus=true,navigate=true){document.body.classList.add('directory-open');$('directory').hidden=false;preview.cover(true);if(navigate)route('#index');if(focus)$('indexClose').focus({preventScroll:true})}
function closeDirectory(focus=true,navigate=true){document.body.classList.remove('directory-open');$('directory').hidden=true;preview.cover(false);if(navigate)route(selected?'#project/'+selected.id:'#overview');if(focus)$('index').focus({preventScroll:true})}
function applyRoute(focus=false){const hash=location.hash,legacy=hash.slice(1),id=hash.startsWith('#project/')?hash.slice(9):legacy;if(projects.some(p=>p.id===id)){choose(id,focus,false);return}if(hash==='#index'){showDirectory(focus,false);return}overview(focus,false)}
$('home').onclick=()=>overview();$('close').onclick=()=>overview();$('index').onclick=()=>showDirectory();$('indexClose').onclick=()=>closeDirectory();$('motion').onclick=()=>{paused=!paused;pauseUI()};document.addEventListener('keydown',e=>{if(e.key==='Escape'){$('directory').hidden?overview():closeDirectory()}});addEventListener('popstate',()=>applyRoute(false));
for (const body of projects) {
  const button = document.createElement('button');

  button.style.color = body.color;
  button.innerHTML = '<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"><path/></svg>';
  button.querySelector('path').setAttribute('d', body.mark);
  button.onclick = () => choose(body.id);
  $('labels').append(button);
  body.label = button;
  const row = document.createElement('div');
  row.className = 'entry';
  const entry = document.createElement('button');
  entry.textContent = body.title;
  const detail = document.createElement('small');
  detail.textContent = body.world + ' · ' + body.discipline;
  entry.append(detail);
  entry.onclick = () => choose(body.id);

$('browse').onclick = () => showDirectory();
function fallback() {
  document.body.classList.add('no-scene');
  $('status').textContent = 'Sky view unavailable on this device.';

try{if(!window.THREE)throw Error('Three.js unavailable');
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(43,innerWidth/innerHeight,.1,700),renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;$('space').append(renderer.domElement);renderer.domElement.addEventListener('webglcontextlost',e=>{e.preventDefault();fallback()});
scene.add(new THREE.AmbientLight(0x94adc6,1.25));scene.add(new THREE.PointLight(0xffdcc0,100,200,1));
function rand(seed){return()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}}const random=rand(693);
const sun=new THREE.Mesh(new THREE.IcosahedronGeometry(3.1,2),new THREE.MeshBasicMaterial({color:0xd5ad74,wireframe:true,transparent:true,opacity:.6}));scene.add(sun);
for(let j=0;j<2;j++){const ring=new THREE.Mesh(new THREE.TorusGeometry(4.1+j*.7,.025,6,120),new THREE.MeshBasicMaterial({color:0xc2a474,transparent:true,opacity:.35}));ring.rotation.x=j?Math.PI/2:.8;sun.add(ring)}
const starPos=[];for(let i=0;i<1800;i++){const r=100+random()*190,a=random()*Math.PI*2,z=random()*2-1;starPos.push(r*Math.sqrt(1-z*z)*Math.cos(a),r*z,r*Math.sqrt(1-z*z)*Math.sin(a))}const sg=new THREE.BufferGeometry();sg.setAttribute('position',new THREE.Float32BufferAttribute(starPos,3));scene.add(new THREE.Points(sg,new THREE.PointsMaterial({size:.18,color:0x99aabe,transparent:true,opacity:.7})));
projects.forEach((p,i)=>{const mesh=new THREE.Mesh(new THREE.IcosahedronGeometry(p.radius,["asteroid","cluster"].includes(p.kind) ? 0 : 2),new THREE.MeshBasicMaterial({color:p.color,wireframe:true,transparent:true,opacity:.6}));if (["asteroid","cluster"].includes(p.kind)) mesh.scale.set(1.25,.72,.85);
mesh.userData.id=p.id;p.mesh=mesh;scene.add(mesh);const points=[];for(let k=0;k<=160;k++)points.push(new THREE.Vector3(Math.cos(k/160*Math.PI*2)*p.orbit,0,Math.sin(k/160*Math.PI*2)*p.orbit));p.track=new THREE.Line(new THREE.BufferGeometry().setFromPoints(points),new THREE.LineBasicMaterial({color:0x668099,transparent:true,opacity:.16}));scene.add(p.track);if(p.id==="silver"){const rings=new THREE.Mesh(new THREE.RingGeometry(3.15,4.5,100),new THREE.MeshBasicMaterial({color:0xbeaf90,wireframe:true,side:THREE.DoubleSide,transparent:true,opacity:.45}));rings.rotation.x=Math.PI/2-.2;mesh.add(rings)}});
let azimuth=.25,elevation=.72,distance=126,drag=null,moved=false;const target=new THREE.Vector3(),wantTarget=new THREE.Vector3(),wantCamera=new THREE.Vector3(),ray=new THREE.Raycaster(),pointer=new THREE.Vector2(),world=new THREE.Vector3(),depthVector=new THREE.Vector3();
renderer.domElement.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,startX:e.clientX,startY:e.clientY};moved=false;renderer.domElement.setPointerCapture(e.pointerId)});renderer.domElement.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.hypot(e.clientX-drag.startX,e.clientY-drag.startY)>5)moved=true;azimuth-=dx*.006;elevation=Math.max(.16,Math.min(1.4,elevation+dy*.004));drag.x=e.clientX;drag.y=e.clientY});renderer.domElement.addEventListener('pointerup',e=>{if(!moved&&drag){pointer.set(e.clientX/innerWidth*2-1,-e.clientY/innerHeight*2+1);ray.setFromCamera(pointer,camera);const hits=ray.intersectObjects(projects.filter(inView).map(p=>p.mesh),false);if(hits.length)choose(hits[0].object.userData.id)}drag=null});renderer.domElement.addEventListener('pointercancel',()=>drag=null);renderer.domElement.addEventListener('wheel',e=>{e.preventDefault();distance=Math.max(65,Math.min(220,distance+e.deltaY*.07))},{passive:false});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
let last=performance.now(),ready=false;function animate(now){requestAnimationFrame(animate);const dt=Math.min((now-last)/1000,.05);last=now;ordered.forEach((p,i) => {
  if (!paused && !selected) p.phase += dt * .025 / (1 + i * .35);
  p.mesh.position.set(Math.cos(p.phase)*p.orbit,0,Math.sin(p.phase)*p.orbit);
  if (p.parent) {
    p.track.position.copy(byId.get(p.parent).mesh.position);
    p.mesh.position.add(p.track.position);
  }
  p.mesh.visible = p.track.visible = !p.parent || inView(p);

});
if(!paused)sun.rotation.y+=dt*.035;wantTarget.copy(selected?selected.mesh.position:new THREE.Vector3());const dist=selected?(innerWidth<680?25:19)+selected.radius*3:distance / Math.min(1, camera.aspect);wantCamera.set(Math.sin(azimuth)*Math.cos(elevation)*dist,Math.sin(elevation)*dist,Math.cos(azimuth)*Math.cos(elevation)*dist).add(wantTarget);const ease=reduced||!ready?1:1-Math.exp(-dt*3);target.lerp(wantTarget,ease);camera.position.lerp(wantCamera,ease);camera.lookAt(target);ready=true;
